name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # テストが通らなければ公開しない
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run typecheck
      - name: テスト
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      # Pages の設定を取得する。まだ「GitHub Actions」ソースになっていなければ
      # enablement: true が有効化する（Settings での手作業を不要にする）。
      - name: Pages の設定
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # base パスは Pages 自身が返す base_path を使う。
      # プロジェクトページなら /<リポジトリ名>、ユーザー/組織ページなら空になるため、
      # 前後のスラッシュを整えてから渡す。
      - name: ビルド
        run: |
          BASE="${{ steps.pages.outputs.base_path }}"
          BASE="/${BASE#/}"
          BASE="${BASE%/}/"
          echo "VITE_BASE=$BASE"
          VITE_BASE="$BASE" npm run build

      # Jekyll による加工を止める（_ で始まるファイルが落とされないように）
      - name: .nojekyll を置く
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
